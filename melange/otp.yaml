# Erlang/OTP (M16, ADR-041): the version .tool-versions pins, built from the
# OTP release tarball with the options the old factory used - the difference
# is that it is built in the architecture's own environment instead of through
# a hand-rolled musl cross toolchain (that is what supersedes ADR-008).
#
# This package supplies the guest's runtime ERTS and OTP applications.
# The factory's Mix release uses include_erts: false and boots this ERTS
# directly instead of duplicating it. The package also supplies the headers
# that on-box NIF builds use.
package:
  name: elixos-otp
  version: "29.1.1"
  epoch: 0
  description: "Erlang/OTP for Elixos: the BEAM the whole OS runs on"
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime: []

vars:
  sha256: 054e0143e39c780e091107fc9b345792a9c1a55f6bac1eca1c1101510fc06bf6

environment:
  contents:
    repositories:
      - https://dl-cdn.alpinelinux.org/alpine/v3.24/main
    packages:
      - alpine-release=3.24.3-r0
      - build-base
      - bash
      - curl
      - ncurses-dev
      - openssl-dev
      - perl
      - zlib-dev

pipeline:
  - runs: |
      # The aarch64 ERTS is cross-compiled on the build machine (ADR-060):
      # scripts/build-image.sh runs melange/otp-cross.yaml in the host's own
      # environment and stages the tree it produced at /home/build/prebuilt/otp,
      # so this package installs that instead of compiling OTP under emulation.
      # aarch64 only - the staged tree is aarch64 code.
      if [ "${{build.arch}}" = aarch64 ] && [ -d /home/build/prebuilt/otp ]; then
        cp -a /home/build/prebuilt/otp/. "${{targets.destdir}}/"
        # Symlinks whose target lies outside the tree cannot survive melange's
        # workspace copy, so scripts/build-image.sh records them next to the
        # tree and they are replayed here.
        if [ -f /home/build/prebuilt/otp.links ]; then
          while IFS="$(printf '\t')" read -r link target; do
            dest="${{targets.destdir}}/$link"
            mkdir -p "$(dirname "$dest")"
            ln -sfn "$target" "$dest"
          done < /home/build/prebuilt/otp.links
        fi
        echo "otp: installed the cross-built aarch64 tree"
        exit 0
      fi

      version="$(sed -n 's/^erlang //p' /home/build/.tool-versions)"
      if [ "$version" != "${{package.version}}" ]; then
        echo "otp: .tool-versions says $version, this package says ${{package.version}}" >&2
        exit 1
      fi

      curl -fsSL -o /tmp/otp.tar.gz \
        "https://github.com/erlang/otp/releases/download/OTP-${version}/otp_src_${version}.tar.gz"
      echo "${{vars.sha256}}  /tmp/otp.tar.gz" | sha256sum -c -

      mkdir -p /tmp/otp
      tar -xzf /tmp/otp.tar.gz -C /tmp/otp --strip-components=1
      cd /tmp/otp

      # Dynamic ssl from the system OpenSSL (the same choice the old factory
      # made, so the image carries openssl and the ERTS links it), and none of
      # the applications a cyberdeck has no use for.
      # Observer ships, without wx: in OTP 29 wx is an *optional*
      # application of observer, so the node can be observed from another
      # machine's Observer GUI - and from etop on its own console - while this
      # image stays free of wxWidgets and a display (that is M27's business).
      ./configure --enable-dynamic-ssl-lib --with-ssl \
        --without-javac --without-wx --without-odbc \
        --without-debugger --without-megaco
      make -j"$(nproc)"
      make install DESTDIR="${{targets.destdir}}"

      # An escript execs `erl` from beside the emulator, and OTP's `erl` is a
      # shell script; on this machine erl is erlexec, with no script in the
      # path (ADR-012's rule, and it still holds for the boot path).
      for erts in "${{targets.destdir}}"/usr/local/lib/erlang/erts-*; do
        ln -sfn erlexec "$erts/bin/erl"
        # ERTS headers for NIF builds, at the path :code.root_dir() reports.
        cp -a "${{targets.destdir}}/usr/local/lib/erlang/usr/include" "$erts/include"
      done

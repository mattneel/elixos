# The Elixos factory (M16, ADR-041): generation 0's release, which points at
# the machine's OTP/ERTS package rather than carrying a second ERTS.
#
# ELIXOS_INCLUDE_ERTS=0 selects that layout; the recipe builds with MIX_ENV=prod,
# not MIX_TARGET=elixos. It adds Mix for on-box builds, links the OTP applications
# and ships the official Hex trust preset. The shim execs erlexec directly,
# never the release's bin/ scripts (ADR-012).
package:
  name: elixos-factory
  version: "0.1.0"
  epoch: 0
  description: "The Elixos factory: the release the shim boots"
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - elixos-otp
      - openssl
      - ncurses-libs
      - libstdc++
      - zlib

vars:
  # Hex builds the release; pinned so two builds resolve the same deps.
  hex: "2.5.1"

environment:
  contents:
    repositories:
      - https://dl-cdn.alpinelinux.org/alpine/v3.24/main
    packages:
      - alpine-release=3.24.2-r0
      - elixos-otp
      - elixos-elixir
      - bash
      - ca-certificates
      - curl
      - openssl

pipeline:
  - runs: |
      # Reuse is safe only for pure-BEAM dependencies: bytecode and symlinks into
      # the target's own OTP install are architecture-neutral (ADR-060/066).
      # M27 added Emerge's NIF; target-aware factory packaging is still required
      # before the GUI can ship. This reuse path does not convert native code.
      # Without a prebuilt tree the build below runs in the package environment.
      if [ -d /home/build/prebuilt/factory ]; then
        cp -a /home/build/prebuilt/factory/. "${{targets.destdir}}/"
      # The symlink layout the native build had (links into the machine's
      # own OTP install, which melange's workspace copy cannot carry): replay
      # the manifest scripts/build-image.sh staged next to the tree.
      if [ -f /home/build/prebuilt/factory.links ]; then
        while IFS="$(printf '\t')" read -r link target; do
          dest="${{targets.destdir}}/$link"
          mkdir -p "$(dirname "$dest")"
          ln -sfn "$target" "$dest"
        done < /home/build/prebuilt/factory.links
      fi

        echo "factory: installed the natively built release"
        exit 0
      fi

      version="$(sed -n 's/^  @version "\(.*\)"$/\1/p' /home/build/os/mix.exs)"
      if [ "$version" != "${{package.version}}" ]; then
        echo "factory: os/mix.exs says $version, this package says ${{package.version}}" >&2
        exit 1
      fi

      export MIX_ENV=prod HEX_HOME=/tmp/hex MIX_HOME=/tmp/mix
      mix local.hex "${{vars.hex}}" --force >/dev/null

      cd /home/build/os
      mix deps.get

      lib=/usr/local/lib/erlang
      erts="$(ls -d "$lib"/erts-* | head -n1)"
      # OTP is the image's own package (elixos-otp): the release points at that
      # install instead of carrying a second copy of the same ERTS.
      ELIXOS_ERTS="$erts" ELIXOS_INCLUDE_ERTS=0 mix release --overwrite --path /tmp/rel

      # The layout the shim's CLI expects: /factory/erts and erts-<vsn> where
      # the ERTS itself looks, /factory/lib, /factory/releases/current - and no
      # bin/ scripts (ADR-012).
      dest="${{targets.destdir}}/factory"
      mkdir -p "$dest"
      cp -a /tmp/rel/. "$dest/"
      rm -rf "$dest/bin"

      # The release carries this project and its Hex dependencies; the OTP
      # applications themselves live in the machine's own OTP install
      # (elixos-otp), so the release points at them - same versions, same
      # install - instead of copying them.
      for app in "$lib"/lib/*; do
        name="$(basename "$app")"
        [ -e "$dest/lib/$name" ] || ln -sfn "$app" "$dest/lib/$name"
      done

      ln -sfn "$erts" "$dest/$(basename "$erts")"
      ln -sfn "$(basename "$erts")" "$dest/erts"
      ln -sfn "$version" "$dest/releases/current"

      # The box builds Mix projects itself (M11), and `mix release` leaves the
      # mix application out.
      cp -a /usr/local/lib/elixir/lib/mix "$dest/lib/"

      # No shell scripts (ADR-012), but *escript* starts its erl with
      # `-boot no_dot_erlang`, which ERTS looks up under $ROOTDIR/bin: that
      # compiled boot script is the one file an escript needs from the removed
      # bin/. It lives in the OTP install.
      mkdir -p "$dest/bin"
      ln -sfn "$lib/bin/no_dot_erlang.boot" "$dest/bin/no_dot_erlang.boot"

      # The official Hex repository: the factory ships its public key and the
      # preconfigured entry, so a box trusts it without anyone adding a
      # repository first (ADR-019). /priv/hex/ is the box's own copy and wins
      # once it exists.
      mkdir -p "$dest/hex/keys"
      cp /home/build/hex/keys/elixos.pub "$dest/hex/keys/elixos.pub"
      {
        printf '[\n  elixos: [\n    url: "https://mattneel.github.io/elixos",\n    key: """\n'
        cat /home/build/hex/keys/elixos.pub
        printf '"""\n  ]\n]\n'
      } > "$dest/hex/repos.exs"

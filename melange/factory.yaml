# The Elixos factory (M16, ADR-041): generation 0's release, which points at
# the machine's OTP/ERTS package rather than carrying a second ERTS.
#
# ELIXOS_INCLUDE_ERTS=0 selects that layout; the recipe builds with MIX_ENV=prod,
# not MIX_TARGET=elixos. It adds Mix for on-box builds, links the OTP applications
# and ships the official Hex trust preset. The shim execs erlexec directly,
# never the release's bin/ scripts (ADR-012).
package:
  name: elixos-factory
  version: "0.1.0"
  epoch: 0
  description: "The Elixos factory: the release the shim boots"
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - elixos-otp
      - openssl
      - ncurses-libs
      - libstdc++
      - zlib

environment:
  contents:
    repositories:
      - https://dl-cdn.alpinelinux.org/alpine/v3.24/main
    packages:
      - alpine-release=3.24.3-r0
      - elixos-otp
      - elixos-elixir
      - bash
      - ca-certificates
      - curl
      - openssl

pipeline:
  - runs: |
      # Foreign architectures never compile here (ADR-094): scripts/build-image.sh builds
      # the arm64 factory natively (melange/factory-cross.yaml) and stages it.
      if [ "${{build.arch}}" != x86_64 ]; then
        [ -d /home/build/prebuilt/factory/factory ] || {
          echo "factory: no cross-built ${{build.arch}} factory staged; build with scripts/build-image.sh" >&2
          exit 1; }
        cp -a /home/build/prebuilt/factory/. "${{targets.destdir}}/"
        if [ -f /home/build/prebuilt/factory.links ]; then
          while IFS="$(printf '\t')" read -r link target; do
            dest="${{targets.destdir}}/$link"
            mkdir -p "$(dirname "$dest")"
            ln -sfn "$target" "$dest"
          done < /home/build/prebuilt/factory.links
        fi
        echo "factory: installed the cross-built ${{build.arch}} tree"
        exit 0
      fi
      export FACTORY_DEST="${{targets.destdir}}" FACTORY_ARCH="${{build.arch}}"
      export FACTORY_VERSION="${{package.version}}" FACTORY_EVAL=0
      bash /home/build/scripts/package-factory.sh

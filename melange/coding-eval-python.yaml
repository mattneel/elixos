# ADR-092: target-native system CPython plus an immutable package-built venv.
# No pip/uv/setup entrypoint or environment mutation is installed in the guest.
package:
  name: elixos-coding-eval-python
  version: "0.1.0"
  epoch: 0
  description: "Optional Oh-My-Jido CPython 3.14 grpcio/protobuf Eval runtime"
  copyright:
    - license: Apache-2.0 AND BSD-3-Clause AND PSF-2.0 AND MIT
  dependencies:
    runtime:
      - python3=3.14.8-r0
      - libstdc++
      - libgcc

environment:
  contents:
    repositories:
      - https://dl-cdn.alpinelinux.org/alpine/v3.24/main
    packages:
      - alpine-release=3.24.3-r0
      - python3=3.14.8-r0
      - py3-pip=26.1.2-r0
      - ca-certificates
      - binutils
      - libstdc++
      - libgcc

pipeline:
  - runs: |
      python3 /home/build/scripts/coding-eval/python-package.py "${{targets.destdir}}" "${{build.arch}}"
      python3 /home/build/scripts/coding-eval-native.py "${{targets.destdir}}" "${{build.arch}}" /opt/oh-my-jido-eval/native.json

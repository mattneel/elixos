# The arm64 factory, built on the build host (ADR-094, extending ADR-060).
#
# The factory is BEAM bytecode, Elixir's Mix/ExUnit and source copies: no
# compiled native code (Emerge's NIF is a symlink into /system/gui, built by
# the renderer cross recipe). What is target-specific is configuration -
# RustlerPrecompiled and Emerge read TARGET_ARCH/TARGET_ABI at compile time,
# the Nerves convention for cross builds - and the receipt's architecture.
# So the same scripts/package-factory.sh runs here, in this machine's native
# environment with the native OTP and Elixir, told which target it builds for;
# melange/factory.yaml's aarch64 branch installs the tree it stages.
# Compiling the factory inside an emulated arm64 environment ran every Elixir
# compiler process under qemu-user, which is what this replaces.
package:
  name: elixos-factory-cross
  version: "0.1.0"
  epoch: 0
  description: "The Elixos factory for arm64, built on the build host (build tool)"
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime: []

environment:
  contents:
    repositories:
      - https://dl-cdn.alpinelinux.org/alpine/v3.24/main
    packages:
      - alpine-release=3.24.3-r0
      - elixos-otp
      - elixos-elixir
      - bash
      - ca-certificates
      - curl
      - openssl

pipeline:
  - runs: |
      # The OTP the bytecode targets is the same release on both machines: the
      # cross-built aarch64 ERTS and this native one are one version.
      export FACTORY_DEST="${{targets.destdir}}" FACTORY_ARCH=aarch64
      export FACTORY_VERSION="${{package.version}}" FACTORY_EVAL=0
      export FACTORY_SYSTEM_ARCHITECTURE=aarch64-unknown-linux-musl
      bash /home/build/scripts/package-factory.sh

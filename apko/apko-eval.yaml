# ADR-092: opt-in factory profile. No base image lock/output/disk is replaced.
contents:
  keyring:
    - apko/keys/alpine-devel@lists.alpinelinux.org-6165ee59.rsa.pub
  repositories:
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/community
  packages:
    - alpine-baselayout
    - busybox
    - alpine-release=3.24.3-r0
    - ca-certificates-bundle
    - util-linux-misc=2.42.3-r1
    - elixos-shim
    - elixos-kernel
    - elixos-otp
    - elixos-elixir
    - elixos-factory-eval=0.1.0-r0
    - elixos-coding-eval-python=0.1.0-r0

accounts:
  users:
    - username: elixos
      uid: 1000
      gid: 1000
      homedir: /priv/home
      shell: /bin/false
    - username: postgres
      uid: 70
      gid: 70
      homedir: /priv/postgres
      shell: /bin/false
  groups:
    - groupname: elixos
      gid: 1000
    - groupname: input
      gid: 23
      members: [elixos]
    - groupname: video
      gid: 27
      members: [elixos]
    - groupname: postgres
      gid: 70

paths:
  - path: /priv
    type: directory
    uid: 0
    gid: 0
    permissions: 0o755
  - path: /system
    type: directory
    uid: 0
    gid: 0
    permissions: 0o755
  - path: /dev/shm
    type: directory
    uid: 0
    gid: 0
    permissions: 0o1777
  - path: /usr/share/icu
    type: directory
    uid: 0
    gid: 0
    permissions: 0o755
  - path: /usr/share/zoneinfo
    type: directory
    uid: 0
    gid: 0
    permissions: 0o755

archs:
  - x86_64
  - aarch64

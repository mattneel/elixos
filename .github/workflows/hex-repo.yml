name: Hex repo

# Builds the official Elixos Hex repository (ADR-019) and publishes it to
# GitHub Pages, so the URL the factory preconfigures always serves a signed
# registry. Packages are the source Mix projects under hex/packages/, filtered
# for prod/elixos by the SDK, plus tarballs dropped into hex/prebuilt/.
#
# One-time setup on the repository:
#   * Settings -> Pages -> Source: GitHub Actions
#   * Settings -> Secrets and variables -> Actions -> New secret:
#       ELIXOS_HEX_PRIVATE_KEY = the contents of the private key whose public
#       half is hex/keys/elixos.pub (see hex/README.md; keep a backup, the
#       factory images ship the public key and cannot verify a new one).
#
# Without that secret the build still runs (packages must keep building) but
# stops before signing: only `mix hex.registry build` with the real key
# produces a registry the factory images accept, and publishing an unsigned
# one would be worse than publishing none. The run is green, with a warning,
# until the secret exists.

on:
  push:
    branches: [master]
    paths:
      - "hex/**"
      - ".github/workflows/hex-repo.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: hex-repo
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      signed: ${{ steps.sign.outputs.signed }}
    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        with:
          otp-version: "29.1.1"
          elixir-version: "1.20.4"

      - name: Install Hex
        run: mix local.hex --force

      - name: Test SDK source packaging and generated consumers
        working-directory: hex/packages/elixos_sdk
        run: mix test

      - name: Test shared portable library
        working-directory: hex/packages/elixos_demo_stats
        run: mix test

      - name: Test native demo's portable behavior and fresh-VM state recovery
        working-directory: hex/packages/elixos_demo
        run: |
          mix deps.get --only test --target host
          mix test

      - name: Build package tarballs
        run: ./hex/build-packages.sh

      - name: Sign the registry
        id: sign
        env:
          ELIXOS_HEX_PRIVATE_KEY: ${{ secrets.ELIXOS_HEX_PRIVATE_KEY }}
        run: |
          if [ -z "$ELIXOS_HEX_PRIVATE_KEY" ]; then
            echo "::warning title=Hex repo not published::ELIXOS_HEX_PRIVATE_KEY is not set, so the registry was not signed or published. See the header of .github/workflows/hex-repo.yml."
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          ./hex/build-repo.sh
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - uses: actions/configure-pages@v5
        if: steps.sign.outputs.signed == 'true'

      - uses: actions/upload-pages-artifact@v3
        if: steps.sign.outputs.signed == 'true'
        with:
          path: build/hex-repo/public

  deploy:
    needs: build
    if: needs.build.outputs.signed == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

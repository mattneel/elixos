# The Elixos root filesystem (M16, ADR-041).
#
# apko assembles it from a pinned stable Alpine release plus our own APKs
# (melange's output, added by scripts/build-image.sh as a build repository).
# apko runs no package install scripts, so anything a script would have
# created - users an image needs, directories outside a package - is declared
# here instead.
contents:
  keyring:
    - apko/keys/alpine-devel@lists.alpinelinux.org-6165ee59.rsa.pub
  repositories:
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/community
  packages:
    - alpine-baselayout
    - busybox
    - alpine-release
    # The machine's CA bundle (:public_key.cacerts_get/0 reads it).
    - ca-certificates-bundle
    # Our own APKs (melange's output, added as a build repository by
    # scripts/build-image.sh): the shim is /init, the kernel is the file the
    # firmware loads, OTP and Elixir are the machine's own installations, and
    # the factory is the release the shim execs - pointing at that OTP rather
    # than carrying a second ERTS.
    - elixos-shim
    - elixos-kernel
    - elixos-otp
    - elixos-elixir
    - elixos-factory

accounts:
  users:
    - username: elixos
      uid: 1000
      gid: 1000
      homedir: /priv/home
      shell: /bin/false
    - username: postgres
      uid: 70
      gid: 70
      homedir: /priv/postgres
      shell: /bin/false
  groups:
    - groupname: elixos
      gid: 1000
    - groupname: input
      gid: 23
      members: [elixos]
    - groupname: video
      gid: 27
      members: [elixos]
    - groupname: postgres
      gid: 70

# apko runs no install scripts: anything a package's script would have created
# has to be declared. /priv is the persistent disk's mount point - the shim
# mounts it before the BEAM starts, and a missing mount point sends the boot to
# rescue. PID 1 recreates /dev/shm after devtmpfs hides this declaration.
# The two data mountpoints export non-relocatable service assets only in normal mode.
paths:
  - path: /priv
    type: directory
    uid: 0
    gid: 0
    permissions: 0o755
  - path: /system
    type: directory
    uid: 0
    gid: 0
    permissions: 0o755
  - path: /dev/shm
    type: directory
    uid: 0
    gid: 0
    permissions: 0o1777
  - path: /usr/share/icu
    type: directory
    uid: 0
    gid: 0
    permissions: 0o755
  - path: /usr/share/zoneinfo
    type: directory
    uid: 0
    gid: 0
    permissions: 0o755

archs:
  - x86_64
  - aarch64
  - riscv64
